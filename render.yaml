services:
  - type: web
    name: terraform-arena
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ARENA_TERRAFORM
        value: "0"
      - key: ARENA_ALLOW_APPLY
        value: "0"
