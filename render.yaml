services:
  - type: web
    name: terraform-arena
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: ARENA_TERRAFORM
        value: "0"
      - key: ARENA_ALLOW_APPLY
        value: "0"
      - key: ARENA_HTTPS_ONLY
        value: "1"
      - key: ARENA_SECRET_KEY
        generateValue: true
      - key: GOOGLE_REDIRECT_URI
        value: https://terraform-arena.onrender.com/auth/google/callback
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
